name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  theorem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Lean proof
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: theorem
